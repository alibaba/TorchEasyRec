name: Unit Test PPU CI

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unittest-ppu-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dsw-test:
    uses: alibaba/TorchEasyRec/.github/workflows/dsw_ci.yml@master
    with:
      lane: ppu
      ref: ${{ github.sha }}
  ci-test:
    needs: dsw-test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the DSW test job to succeed
        env:
          TEST_RESULT: ${{ needs.dsw-test.result }}
        run: test "$TEST_RESULT" = success
