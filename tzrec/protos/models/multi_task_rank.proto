syntax = "proto2";
package tzrec.protos;

import "tzrec/protos/module.proto";
import "tzrec/protos/tower.proto";

message SimpleMultiTask {
    repeated TaskTower task_towers = 1;
}

message MMoE {
    // mmoe expert module definition
    required MLP expert_mlp = 1;
    // mmoe gate module definition
    optional MLP gate_mlp = 2;
    // number of mmoe experts
    required uint32 num_expert = 3 [default=3];
    // task tower
    repeated TaskTower task_towers = 4;
}

message DBMTL {
    // shared bottom MaskNet module
    optional MaskNetModule mask_net = 6;
    // shared bottom mlp layer
    optional MLP bottom_mlp = 1;
    // mmoe expert mlp layer definition
    optional MLP expert_mlp = 2;
    // mmoe gate module definition
    optional MLP gate_mlp = 3;
    // number of mmoe experts
    optional uint32 num_expert = 4 [default=3];
    // bayes task tower
    repeated BayesTaskTower task_towers = 5;
}

message DC2VR {
    // shared bottom mlp layer
    optional MLP bottom_mlp = 1;
    // mmoe expert mlp layer definition
    optional MLP expert_mlp = 2;
    // mmoe gate module definition
    optional MLP gate_mlp = 3;
    // number of mmoe experts
    optional uint32 num_expert = 4 [default=3];
    // task tower
    repeated InterventionTaskTower task_towers = 5;
}



message PLE {
    // extraction network
    repeated ExtractionNetwork extraction_networks = 1;
    // task tower
    repeated TaskTower task_towers = 2;
}


message DlrmHSTU {
    // hstu config
    required HSTU hstu = 1;
    // multi task tower config
    required FusionMTLTower fusion_mtl_tower = 2;
    // max sequence length
    required uint32 max_seq_len = 3;
    // item embedding mlp hidden dimension
    optional uint32 item_embedding_hidden_dim = 4 [default = 512];
    // enables loss averaging computation globally across all ranks (total rank)
    // instead of locally (local rank).
    optional bool enable_global_average_loss = 5 [default = true];
    // timestamp of sequence is ascending or descending
    optional bool sequence_timestamp_is_ascending = 6 [default = true];
    // concat all contextual features on channel dim as one token
    optional bool concat_contextual_features = 7 [default = false];
}

message UltraHSTU {
    // Mixture of Transducers: one HSTU per channel; per-candidate
    // outputs are concatenated on the embedding dim.  >= 2 entries
    // requires every entry to set a unique non-empty `name` plus the
    // matching `<name>` / `<name>_action` / `<name>_watchtime` /
    // `<name>_timestamp` feature_groups.  Candidate-side and
    // contextual groups are shared across all channels.
    repeated HSTU hstu = 1;
    // multi task tower config
    required FusionMTLTower fusion_mtl_tower = 2;
    // max sequence length
    required uint32 max_seq_len = 3;
    // item embedding mlp hidden dimension
    optional uint32 item_embedding_hidden_dim = 4 [default = 512];
    // enables loss averaging computation globally across all ranks (total rank)
    // instead of locally (local rank).
    optional bool enable_global_average_loss = 5 [default = true];
    // timestamp of sequence is ascending or descending
    optional bool sequence_timestamp_is_ascending = 6 [default = true];
    // concat all contextual features on channel dim as one token
    optional bool concat_contextual_features = 7 [default = false];
}

// Cross-task attention mask A of the OneRank prediction head (paper 2.4).
// Task order follows the order of fusion_mtl_tower.task_configs.
enum OneRankCrossTaskMask {
    // A[k][j] = 1 iff j <= k.  Default for nested label families -- e.g.
    // duration bitmasks whose label sets only grow, each positive
    // implying the ones before it: the labels form a single strictly
    // cumulative chain, so a task may read the tasks it is nested
    // inside and nothing else.
    ONERANK_MASK_CASCADE = 0;
    // A = I; every task head reads only itself.
    ONERANK_MASK_PARALLEL = 1;
    // A = all ones; every task head reads every other task.
    ONERANK_MASK_FULL = 2;
    // Cascade among the tasks listed in `hybrid_chain_task_names`,
    // identity for everything else.
    ONERANK_MASK_HYBRID = 3;
}

// Situation Discernment (paper 2.3): per-task query built from the
// contextual token, cross-candidate aggregation via softmax MHCA.
// Absent == the module is skipped and the per-task request-level vector
// degenerates to a mean over candidates (ablation V5).
message OneRankSituationDiscernment {
    // heads of the cross-candidate multi-head cross attention
    optional uint32 num_heads = 1 [default = 4];
    // attention dropout ratio
    optional float dropout_ratio = 2 [default = 0.0];
}

// Cross-task prediction head (paper 2.4).  Absent == skipped, the
// per-task vectors go straight to the inner-product scorer (ablation V3).
message OneRankCrossTaskHead {
    optional OneRankCrossTaskMask mask_type = 1 [default = ONERANK_MASK_CASCADE];
    // Strategic Gradient Detachment: keep gradients only on the diagonal so
    // the off-diagonal cross-task attention acts as a read-only memory.
    optional bool gradient_detachment = 2 [default = true];
    optional uint32 num_heads = 3 [default = 4];
    // position-wise FFN hidden dim; 0 == 4x the stu embedding dim
    optional uint32 ffn_hidden_dim = 4 [default = 0];
    optional float dropout_ratio = 5 [default = 0.0];
    // task names forming the cascade chain when mask_type is
    // ONERANK_MASK_HYBRID; ignored otherwise
    repeated string hybrid_chain_task_names = 6;
}

message OneRankConfig {
    optional OneRankSituationDiscernment situation_discernment = 2;
    optional OneRankCrossTaskHead cross_task_head = 3;
    // scoring function of the head, one of "dot_product", "bilinear"
    // or "mlp"; validated at head construction (see
    // docs/source/models/dlrm_hstu_onerank.md for when to move off the
    // paper default).
    optional string scorer_type = 5 [default = "dot_product"];
    // hidden dim of the MLP scorer.  Only scorer_type="mlp" reads it,
    // but the positivity check is unconditional so a config that flips
    // scorer_type to MLP later fails at build time, not mid-run.
    optional uint32 scorer_hidden_dim = 6 [default = 256];
    // per-task initial logits b_k, in task_configs order; exactly one
    // entry per task (len == len(task_configs)), and empty keeps the
    // zeros of previous runs.  logit(CTR_k) skips the descent onto the
    // constant-prediction start: the descent itself is cheap, but the
    // plateau escape it would otherwise have to pay for is an order of
    // magnitude slower.
    repeated double task_bias_init = 7;
}

message DlrmHSTUOneRank {
    // Fields 1-7 mirror DlrmHSTU so an existing dlrm_hstu block can be
    // reused verbatim (OneRank resolves the `stu.contextual_seq_len`
    // sentinel to 0 automatically; see OneRankHSTUTransducer).
    // hstu config
    required HSTU hstu = 1;
    // multi task tower config; OneRank reads `task_configs` (task names,
    // labels, bitmasks, losses, metrics) but replaces the fused tower
    // itself with per-task inner-product scoring, so `mlp` is ignored.
    required FusionMTLTower fusion_mtl_tower = 2;
    // max sequence length of the sequence that enters the STU backbone,
    // i.e. AFTER the candidate-group inflation (the tokenizer expands
    // each candidate into 2K tokens).  Same contract as DlrmHSTU's
    // max_seq_len -- it is both the attention-output scaling divisor and
    // the static bucket fed to `set_static_max_seq_lens` -- but it bounds
    // the inflated sequence, not the raw input.  A request whose inflated
    // sequence exceeds it fails with a clear error at runtime (see
    // OneRankHSTUTransducer).
    required uint32 max_seq_len = 3;
    // item embedding mlp hidden dimension.  IGNORED by this model (OneRank
    // builds no candidate-side `_item_embedding_mlp`; candidates reuse the
    // user-sequence embedding table); kept only so an existing dlrm_hstu
    // block can be reused verbatim.
    optional uint32 item_embedding_hidden_dim = 4 [default = 512];
    // enables loss averaging computation globally across all ranks (total rank)
    // instead of locally (local rank).
    optional bool enable_global_average_loss = 5 [default = true];
    // timestamp of sequence is ascending or descending
    optional bool sequence_timestamp_is_ascending = 6 [default = true];
    // concat all contextual features on channel dim as one token
    optional bool concat_contextual_features = 7 [default = false];

    // OneRank-specific configuration.  The number of task tokens K is
    // implied by len(fusion_mtl_tower.task_configs).
    required OneRankConfig onerank = 8;
}

message PEPNet {
    // epnet hidden units
    optional uint32 epnet_hidden_unit = 1;
    // activation function for epnet
    optional float  epnet_gamma = 2 [default = 2.0];
    // ppnet hidden units
    repeated uint32 ppnet_hidden_units = 3;
    // activation function for ppnet
    optional string ppnet_activation = 4 [default = 'nn.ReLU'];
    // ratio of dropout
    repeated float ppnet_dropout_ratio = 5;
    optional float  ppnet_gamma = 6 [default = 2.0];
    // domain feature name, must is num bucket
    optional string domain_input_name = 7;
    // domain number for each task
    optional uint32 task_domain_num = 8 [default = 1];
    // task tower
    repeated TaskTower task_towers = 9;
}
