syntax = "proto2";
package tzrec.protos;

// Generative (causal-LM) recommendation models.
//
// Shared, architecture-agnostic config lives in `GenerativeRecLMConfig`, embedded
// as `common` in every family message; family-specific knobs (the backbone, the
// chat template) live on the family message itself.

// Architecture-agnostic config shared by all generative-rec families.
// Sample contract:
//   * history : list<int64> -- local 1-based per-level codes in
//               [1, codebook[level]], laid out as whole items in level order;
//               the single JAGGED_SEQUENCE feature_group (its one member).
//   * answer  : list<int64> -- one item's local 1-based codes; the FIRST
//               `data_config.label_field`, NOT a feature.
// The model derives level_offsets from codebook and maps each code at batch
// time: token_id = base_vocab + level_offsets[level] + code - 1. Sample
// writers must not pre-apply level_offsets.
message GenerativeRecLMConfig {
    // SID vocabulary, one entry per RQ level: each public code is in
    // [1, codebook[level]]. len = codes per item (answer width); sum = atoms
    // appended as C0..C{sum-1} after the base vocab.
    repeated uint32 codebook = 2;
    // Pad the post-extension vocab up to a multiple of this value; 0 disables
    // padding.
    optional uint32 vocab_pad_to_multiple_of = 3 [default = 128];


    // Cross-entropy ignore index -- matches PyTorch's F.cross_entropy default.
    optional int32 ignore_index = 6 [default = -100];

    // Beam search (inference only). num_return_sequences must not exceed
    // num_beams.
    optional uint32 num_beams = 7 [default = 50];
    optional uint32 num_return_sequences = 8 [default = 50];
    // When set, decode with the escalating beam: the width doubles at every SID
    // level, returning up to num_beams * 2**num_levels candidates (capped by the
    // codebook). num_return_sequences is ignored.
    optional bool dynamic_beam = 9 [default = false];

    // Prediction key the generated SIDs are emitted under; reference it from
    // PredictWrapper output_cols.
    optional string generated_sids_key = 12 [default = "generated_sids"];
    // Backbone PARAM dtype = the fp32 MASTER weights. "float32" avoids bf16-ULP
    // underflow of Adam's small (lr=1e-5) updates; bf16 COMPUTE comes from
    // mixed_precision:"BF16" autocast, NOT the param dtype. One of:
    // float32 | bfloat16 | float16.
    optional string param_dtype = 13 [default = "float32"];

    // Model's history budget in SID codes: the item-aligned, recency-preserving
    // truncation cap AND the activation-pool pre-size. Distinct from the history
    // feature's own sequence_length. Set to 0 to disable both.
    required uint32 max_sequence_length = 14;
}

// Qwen2 / Qwen2.5 family (Qwen2.5-0.5B, etc.).
message Qwen2RecLM {
    optional GenerativeRecLMConfig common = 1;

    // Qwen2 backbone: HF hub id or local path; must be a Qwen2 model.
    optional string hf_model_id = 2 [default = "Qwen/Qwen2.5-0.5B"];

    // ----- Chat template -----
    // Optional override for the system instruction. Empty -> the Qwen2 default.
    optional string system_instruction = 10 [default = ""];
    // Optional text wrapping the SID codes in the user message, e.g.
    // "The user's history is as follows: " / ", predict the semantic id of the
    // next item the user will interact with".
    optional string user_prefix_text = 11 [default = ""];
    optional string user_suffix_text = 12 [default = ""];
}
