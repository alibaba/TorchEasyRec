name: DSW runner drain
run-name: dsw-drain ${{ inputs.token }}

on:
  workflow_dispatch:
    inputs:
      token:
        required: true
        type: string
      role:
        required: true
        type: choice
        options: [cpu, accel]
      epoch:
        required: true
        type: string
      boot_id:
        required: true
        type: string
      runner_label:
        required: true
        type: string

permissions: {}

jobs:
  park:
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 10
    steps:
      - name: Park this maintenance worker
        env:
          TZCI_ROLE: ${{ inputs.role }}
          TZCI_EPOCH: ${{ inputs.epoch }}
          TZCI_BOOT: ${{ inputs.boot_id }}
          TZCI_TOKEN: ${{ inputs.token }}
        run: |
          /opt/tzci/current/bin/tzci node park \
            --role "$TZCI_ROLE" --epoch "$TZCI_EPOCH" \
            --boot-id "$TZCI_BOOT" --token "$TZCI_TOKEN"
