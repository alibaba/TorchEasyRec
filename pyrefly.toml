# Type-checking configuration for TorchEasyRec.
# Based on https://github.com/pytorch/pytorch/blob/main/pyrefly.toml
python-version = "3.11"

project-includes = ["tzrec/**/*.py"]
project-excludes = [
    # Generated by scripts/gen_proto.sh.
    "tzrec/**/*_pb2.py",
    "tzrec/**/*_pb2.pyi",
    # Triton kernels: the JIT decorators erase the launch-time keyword arguments
    # (num_warps, num_stages), so every kernel call looks ill-formed.
    "tzrec/ops/_triton/**",
    "**/__pycache__/**",
]

# Optional or untyped third-party dependencies that are absent from most environments.
ignore-missing-imports = [
    "torch_tensorrt.*",
    "torch_fx_tool.*",
    "feature_store_py.*",
    "dynamicemb.*",
    "hstu.*",
    "easy_rec.*",
    "pangudfs_client.*",
]

# faiss ships SWIG-generated stubs that describe the C++ signatures rather than the
# Python API (index.train(x), index.search(query, k)). torch_tensorrt is only present
# in the TRT images, and its dynamo entry points do not resolve; treating it as Any
# keeps the check identical with and without it installed.
replace-imports-with-any = ["faiss.*", "torch_tensorrt.*"]

# Honor the existing `# pyre-ignore` / `# pyre-fixme` suppressions.
permissive-ignores = true

# torch's `nn.Module.__getattr__` is typed as `Tensor | Module`, so every attribute
# access on a submodule degrades to that union. These four codes are almost entirely
# that gap plus un-narrowed `Optional`s. Pyre suppressed the same errors, but by
# matching message substrings rather than by code, so turning the codes off project-wide
# is the broader relaxation: a genuinely wrong argument type in plain Python used to fail
# and now passes.
# TODO(hongsheng.jhs): narrow this back down per subtree via [[sub-config]] -- starting
# with `bad-argument-type`, which has the least to do with the torch union -- as the
# un-narrowed `Optional` accesses are cleaned up.
errors.missing-attribute = false
errors.bad-argument-type = false
errors.not-callable = false
errors.unsupported-operation = false

# Tests stand structural doubles in for real types on purpose: SimpleNamespace for a
# tracker, a bare Module where a ManagedCollisionModule is declared, a plain Tensor
# where a Parameter is. Asserting each of those with cast() is ceremony, so the codes
# that only fire on them are off for test code; every other check stays on.
[[sub-config]]
matches = "tzrec/**/*_test.py"
[sub-config.errors]
bad-assignment = false
bad-index = false
not-iterable = false

[[sub-config]]
matches = "tzrec/tests/**"
[sub-config.errors]
bad-assignment = false
bad-index = false
not-iterable = false
